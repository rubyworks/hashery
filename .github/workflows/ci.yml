name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Monthly, to catch breakage from new Ruby or dependency releases
  # when nothing has been pushed.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit tests
        run: bundle exec rubytest -Ilib -Itest test/
      - name: Demos
        run: bundle exec qed -Ilib demo/
      - name: Demos with frozen string literals
        if: matrix.ruby == '4.0'
        run: bundle exec qed -Ilib demo/
        env:
          RUBYOPT: --enable=frozen-string-literal
